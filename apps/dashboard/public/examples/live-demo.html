<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SlowNet live example app</title>
<style>
  :root { color-scheme: light; --canvas:#f5f3ee; --surface:#fff; --line:#dcd8ce; --fg:#1a1916; --secondary:#4f4b43; --accent:#2643d0; --ok:#1d7444; --bad:#be2d26; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--canvas); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 20px; margin: 0; }
  p { margin: 0; color: var(--secondary); }
  .panel { background: var(--surface); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid #837e74; background: var(--surface); color: var(--fg); cursor: pointer; }
  button:hover { background: #ece9e2; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  code, .mono { font-family: ui-monospace, monospace; font-size: 12px; }
  ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
  li { display: grid; grid-template-columns: 9rem 1fr auto; gap: 8px; font-family: ui-monospace, monospace; font-size: 12px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  #status { font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Example app (not part of SlowNet)</h1>
  <p>This page stands in for your app. It loads <code>/slownet-live.js</code> with your session id, then makes ordinary <code>fetch</code> calls. Watch them arrive in the SlowNet flight recorder and change the profile there.</p>
  <div class="panel">
    <p>SlowNet client: <span id="status" class="mono">not started</span></p>
    <div class="row">
      <button type="button" data-path="/api/demo/catalog">GET /api/demo/catalog</button>
      <button type="button" data-path="/api/demo/account">GET /api/demo/account</button>
      <button type="button" data-path="/api/demo/orders" data-method="POST">POST /api/demo/orders</button>
      <button type="button" id="burst">Burst ×5</button>
    </div>
  </div>
  <div class="panel">
    <p>Responses in this app</p>
    <ol id="log" aria-live="polite"></ol>
  </div>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const session = params.get("session");
  const status = document.getElementById("status");
  if (!session) {
    status.textContent = "missing ?session=… in the URL";
  } else {
    const script = document.createElement("script");
    script.src = "/slownet-live.js";
    script.dataset.session = session;
    script.onload = () => {
      const poll = () => { status.textContent = window.SlowNet?.client?.getStatus() ?? "starting"; };
      poll();
      setInterval(poll, 500);
    };
    document.head.append(script);
  }

  const log = document.getElementById("log");
  async function call(path, method = "GET") {
    const started = performance.now();
    const item = document.createElement("li");
    item.innerHTML = `<span>${method} ${path}</span><span>…</span><span></span>`;
    log.prepend(item);
    try {
      const response = await fetch(path, method === "POST"
        ? { method, headers: { "content-type": "application/json" }, body: JSON.stringify({ productId: "p-101", quantity: 1 }) }
        : undefined);
      item.children[1].textContent = `HTTP ${response.status}`;
      item.children[1].className = response.ok ? "ok" : "bad";
    } catch (error) {
      item.children[1].textContent = error.code ?? error.message;
      item.children[1].className = "bad";
    }
    item.children[2].textContent = `${Math.round(performance.now() - started)} ms`;
  }
  document.querySelectorAll("button[data-path]").forEach((button) =>
    button.addEventListener("click", () => call(button.dataset.path, button.dataset.method)));
  document.getElementById("burst").addEventListener("click", () => {
    for (let index = 0; index < 5; index += 1) call(["/api/demo/catalog", "/api/demo/account"][index % 2]);
  });
</script>
</body>
</html>
